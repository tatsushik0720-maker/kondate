<title>今週の献立</title>
<style>
:root{
  --bg:#faf6f1; --card:#ffffff; --ink:#2b2420; --sub:#7a6e66; --line:#eadfd5;
  --accent:#c2410c; --accent-ink:#ffffff; --soft:#fdebdd; --ok:#2f9e44;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#171412; --card:#231e1b; --ink:#f3ece6; --sub:#a89b91; --line:#3a322d;
    --accent:#ff8a4c; --accent-ink:#1b120c; --soft:#3a2518; --ok:#69db7c; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:16px;line-height:1.5;-webkit-user-select:none;user-select:none}
.top{padding:10px 16px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:700}
.top p{margin:2px 0 0;font-size:13px;color:var(--sub)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 28px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--line)}
.tabs button{flex:1;border:0;background:none;color:var(--sub);font:inherit;font-size:12px;
  padding:8px 0 6px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span{font-size:20px;line-height:1}
.tabs button.on{color:var(--accent);font-weight:700}
button{font:inherit;color:inherit;touch-action:manipulation}
input,select,textarea{font-size:16px}
.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;background:var(--accent);
  color:var(--accent-ink);font-size:17px;font-weight:700;transition:transform .12s ease-out}
.btn:active,.card:active,.item:active{transform:scale(.98)}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;font-size:16px}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.empty{text-align:center;color:var(--sub);padding:36px 8px 20px;font-size:15px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:12px;margin-bottom:10px;transition:transform .12s ease-out}
.card.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.day{width:46px;text-align:center;flex:none}
.day b{display:block;font-size:20px;line-height:1.1}
.day small{font-size:12px;color:var(--sub)}
.card.today .day small{color:var(--accent);font-weight:700}
.dish{flex:1;min-width:0}
.dish b{display:block;font-size:17px;overflow-wrap:anywhere}
.dish small{color:var(--sub);font-size:13px}
.swap{flex:none;min-width:56px;min-height:44px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);font-size:14px;color:var(--ink)}
.swap:active{background:var(--soft)}
h2{font-size:14px;color:var(--sub);margin:18px 2px 8px;font-weight:600}
h2:first-child{margin-top:0}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:8px 8px 8px 12px;margin-bottom:8px;min-height:56px;transition:transform .12s ease-out}
.box{width:26px;height:26px;border-radius:50%;border:2px solid var(--sub);flex:none;
  display:grid;place-items:center;color:transparent;font-size:16px;font-weight:700}
.item.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.item .nm{flex:1;min-width:0}
.item .nm b{font-weight:600;overflow-wrap:anywhere}
.item .nm small{display:block;color:var(--sub);font-size:12px;overflow-wrap:anywhere}
.item.done .nm b{text-decoration:line-through;color:var(--sub)}
.item .q{flex:none;font-weight:600;font-size:15px;text-align:right}
.item.done .q{color:var(--sub)}
.have{flex:none;min-width:44px;min-height:44px;padding:0 8px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 12px;border-radius:20px;border:1px solid var(--line);
  background:var(--card);font-size:14px;color:var(--ink)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.panel p{margin:0 0 10px;font-size:14px;color:var(--sub)}
.panel .btn+.btn{margin-top:8px}
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:88%;background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  animation:up .28s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 18px 18px;min-height:0}
.shead{display:flex;align-items:center;gap:10px;padding:16px 18px 8px}
.shead b{flex:1;font-size:20px;overflow-wrap:anywhere}
.shead button{min-width:64px;min-height:44px;border:0;border-radius:10px;background:var(--card);font-size:15px}
#sheetBody table{width:100%;border-collapse:collapse;font-size:15px}
#sheetBody td{padding:7px 0;border-bottom:1px solid var(--line)}
#sheetBody td:last-child{text-align:right;color:var(--sub);white-space:nowrap}
#sheetBody ol{padding-left:22px;margin:0}
#sheetBody li{margin-bottom:10px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--bg);
  border-radius:12px;padding:10px 12px 10px 14px;display:flex;align-items:center;gap:10px;font-size:14px}
#toast span{flex:1}
#toast button{min-height:40px;padding:0 12px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html{position:fixed;top:0;right:0;bottom:0;left:0;height:auto;padding:0;overflow:hidden}
body{position:absolute;top:0;right:0;bottom:0;left:0;height:auto;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (display-mode: standalone) {
  html{position:static;height:100lvh;overflow:visible}
  body{position:static;height:100lvh;overflow:visible}
  #sheetWrap{bottom:auto;height:100lvh}
  .top{padding-top:10px}
}
</style>

</head>
<body>

  <h1 id="ttl">今週の献立</h1>

<nav class="tabs">
  <button data-tab="plan" class="on"><span>🍚</span>献立</button>
  <button data-tab="shop"><span>🛒</span>買い物</button>
  <button data-tab="set"><span>⚙️</span>設定</button>
</nav>

<div id="sheetWrap" hidden>
  <div id="sheet">
    <div class="shead"><b id="sheetTtl"></b><button id="sheetClose">閉じる</button></div>
    <div id="sheetBody"></div>
  </div>
</div>
<div id="toast" hidden><span id="toastMsg"></span><button id="toastUndo">元に戻す</button></div>
<input type="file" id="file" accept="application/json,.json" hidden>

/* ---------- 保存 ---------- */
const KEY="kondate-v1";
let S = load();
function fresh(){ return {v:1,plan:null,prev:[],checks:{},pantry:{},lastBackup:0,firstUse:Date.now()}; }
function clean(d){
  const s=fresh();
  if(!d||typeof d!=="object") return s;
  if(d.plan&&typeof d.plan==="object"&&/^\d{4}-\d{2}-\d{2}$/.test(d.plan.start)&&Array.isArray(d.plan.days)
     &&d.plan.days.length===7&&d.plan.days.every(n=>typeof n==="string"&&Object.hasOwn(BY,n))) s.plan={start:d.plan.start,days:d.plan.days.slice()};
  if(Array.isArray(d.prev)) s.prev=d.prev.filter(n=>typeof n==="string"&&Object.hasOwn(BY,n));
  if(d.checks&&typeof d.checks==="object") for(const k in d.checks) if(Object.hasOwn(M,k)&&d.checks[k]===true) s.checks[k]=true;
  if(d.pantry&&typeof d.pantry==="object") for(const k in d.pantry) if(Object.hasOwn(M,k)&&typeof d.pantry[k]==="boolean") s.pantry[k]=d.pantry[k];
  if(Number.isFinite(d.lastBackup)) s.lastBackup=d.lastBackup;
  if(Number.isFinite(d.firstUse)&&d.firstUse>0) s.firstUse=d.firstUse;
  return s;
}
function load(){ try{ const t=localStorage.getItem(KEY); return clean(t?JSON.parse(t):null); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

/* ---------- 小さな道具 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayOf(start,i){ const p=start.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]+i); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function frac(v){
  let n=Math.floor(v+0.02), f=v-n; if(f<0.03) return String(n);
  for(const d of [2,3,4,6,8]){ const k=Math.round(f*d); if(k>0&&k<d&&Math.abs(f-k/d)<0.025) return (n?n+"と":"")+k+"/"+d; }
  return String(Math.round(v*10)/10);
}
function qty(name,q){
  const u=M[name][0];
  if(u==="tsp"){
    if(q<=0) return "少々";
    if(q<3) return "小さじ"+frac(q);
    const half=Math.round(q/1.5)*1.5;
    if(Math.abs(half-q)<0.05) return "大さじ"+frac(q/3);
    const tb=Math.floor(q/3); return "大さじ"+tb+"＋小さじ"+frac(q-tb*3);
  }
  if(u==="g"||u==="ml") return Math.round(q)+u;
  return frac(q)+u;
}
const inPantry=n=>(n in S.pantry)?S.pantry[n]:!!M[n][2];

/* ---------- 献立を決める ---------- */
function makePlan(){
  const avoid=new Set(S.plan?S.plan.days:S.prev);
  const pick=[];
  for(const k in QUOTA){
    let pool=shuffle(R.filter(r=>r.k===k&&!avoid.has(r.n)));
    if(pool.length<QUOTA[k]) pool=pool.concat(shuffle(R.filter(r=>r.k===k&&avoid.has(r.n))));
    pick.push(...pool.slice(0,QUOTA[k]));
  }
  let order=shuffle(pick);
  for(let t=0;t<60;t++){ if(order.every((r,i)=>i===0||r.k!==order[i-1].k)) break; order=shuffle(pick); }
  if(S.plan) S.prev=S.plan.days.slice();
  S.plan={start:ymd(new Date()),days:order.map(r=>r.n)};
  S.checks={};
  save();
}
function swapDay(i){
  const used=new Set(S.plan.days), cur=BY[S.plan.days[i]];
  let pool=R.filter(r=>!used.has(r.n)&&r.k===cur.k);
  if(!pool.length) pool=R.filter(r=>!used.has(r.n));
  if(!pool.length) return;
  S.plan.days[i]=pool[Math.floor(Math.random()*pool.length)].n;
  const need=shopList().map(x=>x.name);
  for(const k in S.checks) if(!need.includes(k)) delete S.checks[k];
  save();
}
function shopList(){
  if(!S.plan) return [];
  const m=new Map();
  S.plan.days.forEach(n=>BY[n].ing.forEach(([name,q])=>{
    if(inPantry(name)) return;
    if(!m.has(name)) m.set(name,{name,q:0,dishes:[]});
    const o=m.get(name); o.q+=q; if(!o.dishes.includes(n)) o.dishes.push(n);
  }));
  return [...m.values()];
}

let toastT=0, undoFn=null;
function toast(msg,undo){
  $("toastMsg").textContent=msg; undoFn=undo||null; $("toastUndo").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ $("toast").hidden=true; },5000);
}
$("toastUndo").onclick=()=>{ if(undoFn) undoFn(); undoFn=null; $("toast").hidden=true; };

/* ---------- 操作 ---------- */
main.onclick=e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, n=el.dataset.n, i=Number(el.dataset.i);
  if(act==="make"){
    if(S.plan&&Object.keys(S.checks).length&&!confirm("献立を作り直すと、買い物リストのチェックも消えます。作り直しますか？")) return;
    makePlan(); main.scrollTop=0; render();
  }else if(act==="swap"){ swapDay(i); render(); }
  else if(act==="open"){ openSheet(i); }
  else if(act==="check"){ if(S.checks[n]) delete S.checks[n]; else S.checks[n]=true; save(); render(); }
  else if(act==="have"){
    const had=(n in S.pantry), old=S.pantry[n], chk=!!S.checks[n];
    S.pantry[n]=true; delete S.checks[n]; save(); render();
    toast("「"+n+"」を家にある物にしました", ()=>{ if(had) S.pantry[n]=old; else delete S.pantry[n]; if(chk) S.checks[n]=true; save(); render(); });
  }
  else if(act==="pantry"){ S.pantry[n]=!inPantry(n); if(S.pantry[n]) delete S.checks[n]; save(); el.classList.toggle("on",S.pantry[n]); }
  else if(act==="backup"){ backup(); }
  else if(act==="restore"){ $("file").value=""; $("file").click(); }
};
document.querySelector(".tabs").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; main.scrollTop=0; render(); };

async function backup(){
  const name="kondate-backup-"+ymd(new Date())+".json";
  const text=JSON.stringify(S);
  const done=()=>{ S.lastBackup=Date.now(); save(); if(tab==="set") render(); };
  try{
    const f=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); done(); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); done();
}
$("file").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||typeof d!=="object"||d.v!==1) throw 0;
    if(!confirm("今のデータを、バックアップの内容に置き換えます。よろしいですか？")) return;
    S=clean(d); save(); tab="plan"; render(); toast("バックアップから戻しました");
  }catch(err){ alert("このファイルは読み込めませんでした。このアプリで保存したバックアップを選んでください。"); }
};
render();
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function () {
  function canScroll(el) {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      var s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return true;
      if (/(auto|scroll)/.test(s.overflowX) && el.scrollWidth > el.clientWidth + 1) return true;
    }
    return false;
  }
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) return;
    var t = e.target;
    if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
    if (!canScroll(t)) e.preventDefault();
  }, { passive: false });
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
