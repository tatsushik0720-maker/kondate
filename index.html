<script>
['gesturestart', 'gesturechange', 'gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), { passive: false }));

<title>今週の献立</title>
<style>
:root{
  --bg:#f2f2f7; --cell:#ffffff; --sheet:#f2f2f7; --ink:#000000; --sub:#636366; --sep:rgba(60,60,67,.29);
  --tint:#c2410c; --on-tint:#ffffff; --press:rgba(60,60,67,.12); --ok:#248a3d; --bar:#f9f9f9;
  --fill:rgba(120,120,128,.2); --toast:#2c2c2e; --on-toast:#ffffff; --toast-act:#ffb340;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#000000; --cell:#1c1c1e; --sheet:#1c1c1e; --ink:#ffffff; --sub:#98989f; --sep:rgba(84,84,88,.65);
    --tint:#ff9f0a; --on-tint:#000000; --press:rgba(235,235,245,.16); --ok:#30d158; --bar:#161616;
    --fill:rgba(120,120,128,.36); --toast:#3a3a3c; }
  #sheet{--cell:#2c2c2e}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{font-size:17px;font:-apple-system-body}
html,body{height:100%;overflow:hidden;margin:0}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;
  font-size:1rem;line-height:1.3;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;border:0;background:none;margin:0;text-align:inherit}
input,select,textarea{font-size:16px}

/* 上のバー：大きな題名 */
.top{padding:0 20px 8px;background:var(--bg)}
.top h1{margin:0;font-size:min(2rem,40px);font-weight:700;letter-spacing:.01em;line-height:1.2}
.top p{margin:2px 0 0;font-size:.882rem;color:var(--sub);min-height:1.15em}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 28px}

/* 下のタブ */
.tabs{display:flex;background:var(--bar);border-top:.5px solid var(--sep)}
.tabs button{flex:1;color:var(--sub);font-size:11px;font-weight:500;padding:7px 0 4px;min-height:50px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs svg{width:26px;height:26px;fill:currentColor}
.tabs button.on{color:var(--tint)}
.tabs button:active{opacity:.6}

/* まとまり（iOS の設定画面のような表） */
.hd{margin:22px 16px 7px;font-size:.765rem;color:var(--sub)}
.hd:first-child{margin-top:6px}
.ft{margin:7px 16px 0;font-size:.765rem;color:var(--sub);line-height:1.4}
.group{background:var(--cell);border-radius:12px;overflow:hidden}
.group+.group{margin-top:16px}
.row{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;padding:9px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.tap:active{background:var(--press)}
.row.note{font-size:.882rem;line-height:1.45}
.row.tint{color:var(--tint)}

/* ボタン */
.btn{display:block;width:100%;min-height:50px;border-radius:14px;background:var(--tint);color:var(--on-tint);
  font-size:1rem;font-weight:600;text-align:center;transition:opacity .15s}
.btn:active{opacity:.7}
.txt{flex:none;min-width:44px;min-height:44px;padding:0 4px;color:var(--tint);font-size:1rem;text-align:center;border-radius:8px}
.txt:active{opacity:.4}
.txt.wide{display:block;width:100%;margin-top:14px}
.txt.sm{font-size:.882rem}
.empty{text-align:center;color:var(--sub);padding:48px 12px 24px;font-size:.882rem;line-height:1.6}

/* 献立の行 */
.day{min-width:40px;text-align:center;flex:none}
.day b{display:block;font-size:1.294rem;font-weight:600;line-height:1.15}
.day small{font-size:.706rem;color:var(--sub);white-space:nowrap}
.day.today b,.day.today small{color:var(--tint)}
.day.today small{font-weight:600}
.dish{flex:1;min-width:0;padding:3px 0}
.dish b{display:block;font-weight:600;overflow-wrap:anywhere}
.dish small{display:block;margin-top:2px;color:var(--sub);font-size:.882rem}

/* 買い物の行 */
.box{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);flex:none;
  display:grid;place-items:center;color:transparent;font-size:14px;font-weight:700}
.done .box{background:var(--tint);border-color:var(--tint);color:var(--on-tint)}
.nm{flex:1;min-width:0;overflow-wrap:anywhere}
.nm small{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:2px;color:var(--sub);font-size:.765rem}
.done .nm>span{color:var(--sub);text-decoration:line-through}
.q{flex:none;color:var(--sub);text-align:right;font-size:.941rem}

/* 切り替え */
.sw{flex:none;width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 2px 5px rgba(0,0,0,.25);transition:transform .2s}
[aria-checked="true"] .sw{background:#34c759}
[aria-checked="true"] .sw::after{transform:translateX(20px)}

/* 作り方のシート */
#sheetWrap{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end}
#sheet{width:100%;max-height:90%;background:var(--sheet);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  animation:up .4s cubic-bezier(.32,.72,0,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.shead{display:flex;align-items:center;padding:6px 12px 0;position:relative}
.shead::before{content:"";position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--fill)}
.shead .txt{padding:0 8px;margin-top:8px}
#sheetBody{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 24px;min-height:0}
#sheetBody h3{margin:4px 4px 2px;font-size:min(1.647rem,34px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
#sheetBody .lead{margin:0 4px;color:var(--sub);font-size:.882rem}
.step{align-items:flex-start;line-height:1.45}
.step i{flex:none;width:24px;height:24px;border-radius:50%;background:var(--tint);color:var(--on-tint);
  font-style:normal;font-size:.765rem;font-weight:700;display:grid;place-items:center;margin-top:1px}

/* お知らせ */
#toast{position:fixed;left:12px;right:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:30;background:var(--toast);
  color:var(--on-toast);border-radius:14px;padding:6px 8px 6px 16px;display:flex;align-items:center;gap:10px;font-size:.882rem;
  box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast span{flex:1}
#toast button{min-height:44px;padding:0 10px;color:var(--toast-act);font-weight:600;font-size:.882rem}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html{position:fixed;top:0;right:0;bottom:0;left:0;height:auto;padding:0;overflow:hidden}
body{position:absolute;top:0;right:0;bottom:0;left:0;height:auto;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.tabs{padding-bottom:env(safe-area-inset-bottom,0px)}
@media (display-mode: standalone) {
  html{position:static;height:100lvh;overflow:visible}
  body{position:static;height:100lvh;overflow:visible}
  #sheetWrap{bottom:auto;height:100lvh}
  .top{padding-top:34px}
}
</style>

</head>

<script>

const R = [
{n:"鶏の照り焼き",k:"肉",t:20,i:"鶏もも肉:150,キャベツ:0.125,しょうゆ:3,みりん:3,酒:3,砂糖:1,サラダ油:1",
 s:["鶏もも肉は冷蔵庫から出して10分おく。厚い所に包丁を浅く入れて開き、厚みをそろえる。皮にフォークで数か所穴をあける。キャベツは千切りにして水にさらし、水気を切る。","しょうゆ・みりん・酒・砂糖を小さな器で混ぜておく。","フライパンに油を入れて中火で熱し、皮を下にして入れる。動かさずに5分、皮がきつね色でパリッとするまで焼く。出てきた脂はキッチンペーパーでふき取る。","返して弱めの中火で3分焼く。いちばん厚い所を押して、弾力があれば火が通っている。","合わせた調味料を入れて中火にし、スプーンでたれをかけながら1〜2分、泡が大きくなってとろみが出るまで煮からめる。","まな板に取って1分おき、食べやすく切る。キャベツと盛り、フライパンに残ったたれをかける。"]},
{n:"豚のしょうが焼き",k:"肉",t:15,i:"豚こま肉:120,玉ねぎ:0.25,キャベツ:0.125,おろししょうが:1,しょうゆ:3,みりん:3,酒:3,サラダ油:1",

{n:"肉じゃが",k:"肉",t:30,i:"牛こま肉:80,じゃがいも:1,玉ねぎ:0.5,にんじん:0.33,しょうゆ:4.5,みりん:3,砂糖:3,酒:3,顆粒だし:0.5,サラダ油:1",
 s:["じゃがいもは皮をむいて4つに切り、水に5分さらして水気を切る。玉ねぎは2cm幅のくし形、にんじんは小さめの乱切りにする。","鍋に油を入れて中火で熱し、牛肉をほぐしながら炒める。色が変わったら野菜を入れ、全体に油が回るまで1分炒める。","水150mlと顆粒だし・砂糖・酒・みりんを入れる。煮立ったらアクをすくい、ふたを少しずらしてのせ、弱めの中火で10分煮る。","しょうゆを入れてひと混ぜし、さらに5〜8分煮る。じゃがいもに竹串がすっと通ればよい。","火を止めて5分おくと、味がしみる。煮汁ごと盛る。"]},

 s:["キャベツは4cm角のざく切り、にんじんは薄い短冊切り、ピーマンは種を取って細切りにする。もやしは洗って水気をしっかり切る。","フライパンにごま油を入れて強めの中火で熱し、豚肉を広げて焼く。色が変わったら塩・こしょうを軽くふる。","にんじんを入れて30秒、キャベツとピーマンを入れて1分炒める。水気が出ないよう、火は強めのままにする。","もやしを入れて30秒炒め、鶏がらスープの素をふり入れる。しょうゆを鍋肌から回し入れてひと混ぜする。","野菜の歯ごたえが残っているうちに、すぐ皿に盛る。"]},
{n:"ハンバーグ",k:"肉",t:30,i:"合いびき肉:150,玉ねぎ:0.25,ブロッコリー:0.25,パン粉:6,牛乳:15,塩:0,こしょう:0,ケチャップ:6,ウスターソース:3,サラダ油:1",
 s:["玉ねぎは細かいみじん切りにする。パン粉は牛乳にひたす。ブロッコリーは小房に分け、塩を入れた湯で2分ゆでる。","ひき肉は使う直前まで冷やしておく。ボウルにひき肉と塩ふたつまみ・こしょうを入れ、白っぽく粘りが出るまで1分こねる。玉ねぎとパン粉を入れてさらに混ぜる。","手に油を少しつけ、両手で10回ほど投げ合って空気を抜く。厚さ2cmの小判形にまとめ、中央を指でへこませる。","フライパンに油を入れて中火で熱し、3分焼く。焼き色がついたら返し、ふたをして弱火で7分蒸し焼きにする。","竹串を刺して、澄んだ肉汁が出れば焼き上がり。赤い汁ならあと2分焼く。皿に取る。","フライパンの脂を軽くふき、ケチャップとウスターソースを入れて弱火で30秒煮立てる。ハンバーグにかけ、ブロッコリーを添える。"]},
{n:"鶏のから揚げ",k:"肉",t:30,i:"鶏もも肉:200,レタス:0.125,しょうゆ:3,酒:3,おろししょうが:1,おろしにんにく:1,片栗粉:9,サラダ油:12",
 s:["鶏もも肉は余分な脂を取り、4cm角に切る。ポリ袋に入れ、しょうゆ・酒・しょうが・にんにくを入れてよくもみ、10分おく。","汁気を軽く切り、片栗粉を1切れずつしっかりまぶす。余分な粉ははたく。","小さめのフライパンに油を入れて中火で熱する。菜箸を入れて細かい泡が出たら、皮を下にして並べる。","触らずに3分焼き、まわりが固まったら返してさらに3分焼く。最後に強めの中火にして、30秒ずつ両面をカリッとさせる。","網かキッチンペーパーに取って2分おく。余熱で中まで火が通る。レタスをちぎって一緒に盛る。"]},
{n:"豚キムチ炒め",k:"肉",t:10,i:"豚バラ薄切り肉:100,キムチ:80,ニラ:0.33,ごま油:1,しょうゆ:1",
 s:["豚肉は4cmの長さに切る。ニラは根元を1cm落とし、4cmに切る。キムチが大きければざく切りにする。","フライパンにごま油を入れて中火で熱し、豚肉を広げて炒める。脂が出て、端がカリッとするまで2分ほど焼く。","キムチを汁ごと入れ、1分炒めて酸味を飛ばす。","ニラを入れて20秒だけ炒め、しょうゆを鍋肌から入れてひと混ぜする。ニラがしんなりする前に火を止める。"]},
{n:"麻婆豆腐",k:"肉",t:20,i:"豚ひき肉:80,豆腐:0.5,長ねぎ:0.33,おろししょうが:1,おろしにんにく:1,豆板醤:1,味噌:1.5,しょうゆ:3,砂糖:1,鶏がらスープの素:1,片栗粉:3,ごま油:1",
 s:["豆腐は2cm角に切る。塩ひとつまみを入れた湯で2分ゆでてざるに上げると、崩れにくくなる。長ねぎはみじん切りにする。","片栗粉は水大さじ1で溶く。味噌・しょうゆ・砂糖・鶏がらスープの素を水150mlに混ぜておく。","フライパンにごま油・しょうが・にんにく・豆板醤を入れて弱火にかける。香りが立ったら中火にしてひき肉を入れ、ポロポロになって脂が透き通るまで炒める。","合わせたスープを入れ、煮立ったら豆腐を入れる。フライパンをゆすりながら、中火で3分煮る。","長ねぎを入れ、いったん火を止める。水溶き片栗粉をもう一度混ぜてから回し入れ、やさしく混ぜる。","再び中火にかけ、30秒ふつふつと煮立ててとろみを安定させる。辛いのが苦手なら豆板醤を半分にする。"]},
{n:"回鍋肉",k:"肉",t:15,i:"豚バラ薄切り肉:100,キャベツ:0.125,ピーマン:1,味噌:3,砂糖:2,しょうゆ:1,酒:3,豆板醤:0.5,おろしにんにく:0.5,ごま油:1",
 s:["キャベツは5cm角のざく切りにし、芯は薄くそぐ。ピーマンは種を取って乱切り、豚肉は4cmに切る。","味噌・砂糖・しょうゆ・酒を混ぜ、味噌を溶かしておく。","フライパンにごま油を入れて強めの中火で熱し、キャベツとピーマンを1分炒めていったん取り出す。","同じフライパンに豚肉を広げ、脂が出るまで炒める。にんにくと豆板醤を入れて香りを出す。","野菜を戻し、合わせた調味料を入れて30秒、全体にからめる。キャベツがしゃきっとしているうちに盛る。"]},
{n:"チキンのトマト煮",k:"肉",t:30,i:"鶏もも肉:150,玉ねぎ:0.5,しめじ:0.5,トマト缶:0.5,コンソメ:1,おろしにんにく:1,オリーブ油:3,塩:0,こしょう:0",
 s:["鶏もも肉は4cm角に切り、塩・こしょうをふる。玉ねぎは薄切り、しめじは根元を落としてほぐす。","鍋にオリーブ油を入れて中火で熱し、鶏肉を皮を下にして並べる。3分焼いて焼き色がついたら返す。","にんにく・玉ねぎ・しめじを入れ、玉ねぎがしんなりするまで2分炒める。","トマト缶・水50ml・コンソメを入れる。トマトが丸ごとなら木べらでつぶす。煮立ったらふたをして、弱めの中火で15分煮る。途中で一度、底から混ぜる。","ふたを取り、2分煮つめてとろみをつける。味をみて、塩・こしょうでととのえる。酸っぱければ砂糖をひとつまみ入れる。"]},
{n:"鶏むね肉とブロッコリーのオイスター炒め",k:"肉",t:15,i:"鶏むね肉:150,ブロッコリー:0.5,オイスターソース:3,しょうゆ:1,酒:3,片栗粉:3,ごま油:1",
 s:["鶏むね肉は繊維を断つように、1cm厚さのそぎ切りにする。酒と片栗粉をもみ込むと、しっとり仕上がる。","ブロッコリーは小房に分け、大きいものは半分に切る。茎は皮を厚めにむいて薄切りにする。","フライパンにごま油を入れて中火で熱し、鶏肉を重ならないように並べる。2分焼いて返し、もう1分焼く。","ブロッコリーと水大さじ2を入れ、すぐふたをして2分蒸す。ブロッコリーが鮮やかな緑になればよい。","ふたを取って水気を飛ばし、オイスターソースとしょうゆを入れて30秒からめる。"]},
{n:"豚バラ大根",k:"肉",t:30,i:"豚バラ薄切り肉:100,大根:0.167,しょうゆ:4.5,みりん:3,砂糖:3,酒:3,顆粒だし:0.5",
 s:["大根は皮を厚めにむき、1cm厚さのいちょう切りにする。豚肉は4cmに切る。","鍋を中火で熱し、油をひかずに豚肉を炒める。脂が出てきたら大根を入れ、透き通ってくるまで2分炒める。","水200mlと顆粒だし・砂糖・酒・みりんを入れる。煮立ったらアクをすくい、ふたをして弱めの中火で10分煮る。","しょうゆを入れ、ふたを取って10分ほど煮る。途中で上下を返す。大根があめ色になり、竹串がすっと通ればよい。","煮汁が1/3ほどに減ったら火を止め、5分おいて味をしみ込ませる。"]},
{n:"親子丼",k:"ごはん物",t:15,i:"鶏もも肉:100,玉ねぎ:0.25,卵:2,めんつゆ（3倍）:6,ごはん:1",
 s:["鶏もも肉は2cm角に切る。玉ねぎは5mm幅の薄切りにする。卵は白身を切るように、箸で10回ほど軽く混ぜる。混ぜすぎない。","小さなフライパンにめんつゆと水80mlを入れて中火にかける。煮立ったら鶏肉と玉ねぎを入れ、5分煮る。途中で肉を返す。","鶏肉に火が通ったら、卵の2/3を中心から外へ回し入れる。ふたをして30秒おく。","残りの卵を回し入れ、ふたをして10秒で火を止める。余熱で半熟に仕上げる。","丼に温かいごはんを盛り、すべらせるようにのせる。"]},
{n:"牛丼",k:"ごはん物",t:15,i:"牛こま肉:120,玉ねぎ:0.5,しょうゆ:4.5,みりん:3,砂糖:3,酒:3,顆粒だし:0.5,おろししょうが:1,ごはん:1",
 s:["玉ねぎは1cm幅のくし形に切る。牛肉が大きければ食べやすく切る。","鍋に水100mlと顆粒だし・しょうゆ・みりん・砂糖・酒・しょうがを入れ、中火で煮立てる。","玉ねぎを入れて5分、透き通ってやわらかくなるまで煮る。","牛肉を入れて箸でほぐし、アクをすくう。弱めの中火で5分煮る。煮すぎると固くなるので、色が変わって味がなじめばよい。","丼にごはんを盛り、煮汁ごとのせる。"]},
{n:"カレーライス",k:"ごはん物",t:35,i:"豚こま肉:80,玉ねぎ:0.5,にんじん:0.33,じゃがいも:1,カレールウ:1,サラダ油:1,ごはん:1",
 s:["玉ねぎは2cm幅のくし形、にんじんは小さめの乱切りにする。じゃがいもは皮をむいて4つに切り、水にさらす。","鍋に油を入れて中火で熱し、玉ねぎを2分炒める。豚肉を入れて色が変わるまで炒め、にんじんとじゃがいもを入れてさらに1分炒める。","水200mlを入れる。煮立ったらアクをすくい、ふたをして弱火で15分煮る。じゃがいもに竹串が通ればよい。","必ず火を止めてからルウを入れ、溶けるまで混ぜる。火にかけたままだとダマになる。","弱火にかけ、底が焦げないように混ぜながら5分煮る。とろみがついたら、ごはんにかける。"]},
{n:"チャーハン",k:"ごはん物",t:10,i:"卵:1,長ねぎ:0.33,ウインナー:2,ごはん:1,鶏がらスープの素:1,しょうゆ:1,塩:0,こしょう:0,ごま油:3",
 s:["長ねぎはみじん切り、ウインナーは5mm幅の輪切りにする。卵は溶く。ごはんは温かいものを使う。冷やごはんなら電子レンジで温める。","フライパンにごま油を入れて強めの中火でしっかり熱する。卵を流し入れ、すぐにごはんをのせる。","お玉の背でごはんを押しつけてほぐしながら、卵とからめるように1分炒める。","ウインナーと長ねぎを入れ、鶏がらスープの素・塩・こしょうをふって1分炒める。ごはんがパラッとしてくる。","しょうゆを鍋肌から回し入れ、香りが立ったら全体を混ぜて火を止める。"]},
{n:"オムライス",k:"ごはん物",t:20,i:"鶏もも肉:80,玉ねぎ:0.25,卵:2,ごはん:1,ケチャップ:9,バター:10,塩:0,こしょう:0",
 s:["鶏もも肉は1cm角に切る。玉ねぎはみじん切りにする。卵は塩ひとつまみを入れて溶く。","フライパンにバターの半分を入れて中火で溶かし、鶏肉を2分炒める。玉ねぎを入れて透き通るまで炒める。","具を端に寄せ、空いた所にケチャップ大さじ2を入れて30秒炒める。酸味が飛んで甘くなる。","温かいごはんを入れ、切るように混ぜながら炒める。塩・こしょうで味をととのえ、皿に木の葉形に盛る。","フライパンをさっとふき、残りのバターを中火で溶かす。卵を流し入れて大きく混ぜ、半熟のうちに火を止める。","卵をごはんにすべらせてかぶせ、キッチンペーパーで形をととのえる。残りのケチャップをかける。"]},
{n:"鮭のムニエル",k:"魚",t:15,i:"鮭の切り身:1,ほうれん草:0.5,小麦粉:3,バター:10,塩:0,こしょう:0,しょうゆ:1",
 s:["鮭に塩をふって5分おき、出てきた水気をキッチンペーパーでふく。こしょうをふり、小麦粉を薄くまぶして余分をはたく。","ほうれん草は根元をよく洗い、4cmに切る。","フライパンにバターを入れて中火で溶かし、泡が細かくなったら鮭を盛りつけるときに上になる面から入れる。3分焼いて、こんがりしたら返す。","弱めの中火にして3分焼く。溶けたバターをスプーンでかけると、ふっくらする。身を押して弾力があれば皿に取る。","同じフライパンでほうれん草を30秒炒め、しょうゆで味をつけて添える。"]},
{n:"さばの味噌煮",k:"魚",t:20,i:"さばの切り身:1,長ねぎ:0.33,味噌:4.5,砂糖:3,酒:6,みりん:3,おろししょうが:1",
 s:["さばは皮に十字の切り目を入れる。ざるにのせて熱湯を回しかけ、水で血や汚れを洗って水気をふく。これで臭みが取れる。長ねぎは4cmに切る。","小さな鍋に水100mlと酒・砂糖・みりん・しょうがを入れ、中火で煮立てる。","必ず煮立ったところに、さばを皮を上にして入れる。長ねぎも入れる。","アルミホイルかクッキングシートで落としぶたをして、中火で5分煮る。","味噌を煮汁大さじ2で溶いてから入れる。落としぶたを取り、煮汁をスプーンでかけながら5〜7分、とろりとするまで煮つめる。","皿に盛り、煮汁をたっぷりかける。"]},
{n:"ぶりの照り焼き",k:"魚",t:15,i:"ぶりの切り身:1,小松菜:0.5,しょうゆ:3,みりん:3,酒:3,砂糖:1,サラダ油:1",
 s:["ぶりに塩少々（分量外）をふって5分おき、出てきた水気をキッチンペーパーでしっかりふく。小松菜は4cmに切る。","しょうゆ・みりん・酒・砂糖を混ぜておく。","フライパンに油を入れて中火で熱し、ぶりを入れて2〜3分焼く。焼き色がついたら返し、わきに小松菜を入れて一緒に2分焼く。小松菜は先に皿に取る。","フライパンの余分な脂をふき、合わせた調味料を入れる。スプーンでたれをかけながら1〜2分、照りが出るまで煮からめる。","小松菜と盛り、たれをかける。"]},
{n:"鮭のちゃんちゃん焼き",k:"魚",t:20,i:"鮭の切り身:1,キャベツ:0.125,玉ねぎ:0.25,しめじ:0.5,味噌:3,みりん:3,酒:3,砂糖:1,バター:10",
 s:["キャベツは4cm角のざく切り、玉ねぎは5mm幅の薄切りにする。しめじは根元を落としてほぐす。鮭は塩・こしょう少々（分量外）をふる。","味噌・みりん・酒・砂糖を混ぜてたれを作る。","フライパンにバターの半分を入れて中火で溶かし、鮭を皮から1分ずつ両面焼く。","鮭のまわりに野菜を入れ、たれを全体に回しかける。ふたをして弱めの中火で8分蒸し焼きにする。","ふたを取り、残りのバターをのせる。鮭を軽くほぐし、野菜とたれを混ぜながら食べる。"]},
{n:"えびと卵の炒め物",k:"魚",t:15,i:"むきえび:100,卵:2,長ねぎ:0.33,鶏がらスープの素:1,酒:3,片栗粉:1,塩:0,ごま油:3",
 s:["冷凍のえびは水につけて解凍し、水気をしっかりふく。酒と片栗粉をもみ込む。長ねぎは斜め薄切りにする。","卵に鶏がらスープの素と塩ひとつまみを入れて溶く。","フライパンにごま油の半分を入れて強めの中火で熱し、卵を流し入れる。大きく3回混ぜ、半熟のうちに皿に取り出す。","残りのごま油を入れ、えびを並べて片面1分ずつ焼く。色が変わって丸くなったら長ねぎを入れて30秒炒める。","卵を戻し、大きく混ぜて10秒で火を止める。"]},
{n:"さば缶のトマトパスタ",k:"麺",t:20,i:"スパゲッティ:100,さば缶:1,トマト缶:0.5,おろしにんにく:1,オリーブ油:3,コンソメ:1,塩:0",
 s:["鍋に湯1リットルを沸かして塩小さじ2（分量外）を入れ、スパゲッティを袋の時間より1分短くゆでる。ゆで汁を大さじ3取っておく。","フライパンにオリーブ油とにんにくを入れて弱火にかける。香りが立ったら、さば缶を汁ごと入れて木べらで粗くほぐす。","トマト缶とコンソメを入れ、中火で5分煮る。トマトをつぶしながら、とろりとするまで煮つめる。","スパゲッティとゆで汁を入れ、強めの中火で1分、ソースをからめる。","味をみて、足りなければ塩でととのえる。さば缶に塩気があるので、入れすぎない。"]},
{n:"豆腐ステーキ きのこバターしょうゆ",k:"卵・豆腐",t:15,i:"豆腐:1,しめじ:0.5,小ねぎ:1,片栗粉:3,しょうゆ:3,みりん:3,バター:10",
 s:["豆腐はキッチンペーパーで包み、皿などの重しをのせて10分おいて水切りする。急ぐときは電子レンジ（600W）で2分温める。","厚みを半分に切り、水気をふいて片栗粉を全体にまぶす。しめじはほぐし、小ねぎは小口切りにする。","フライパンにバターを入れて中火で溶かし、豆腐を入れる。触らずに3分焼いてきつね色にし、返してもう3分焼く。皿に取る。","同じフライパンでしめじを1分炒め、しょうゆとみりんを入れてひと煮立ちさせる。","豆腐にきのことたれをかけ、小ねぎを散らす。"]},
{n:"豚ニラ玉",k:"卵・豆腐",t:10,i:"卵:2,ニラ:0.5,豚こま肉:50,鶏がらスープの素:1,しょうゆ:1,ごま油:3",
 s:["ニラは根元を1cm落とし、4cmに切る。卵に鶏がらスープの素を入れて溶く。","フライパンにごま油を入れて中火で熱し、豚肉を広げて炒める。色が変わったらニラを入れ、20秒だけ炒める。","強めの中火にして卵を流し入れる。まわりが固まってきたら、外から中へ大きく3回混ぜる。","半熟のうちに火を止め、しょうゆをたらして皿に盛る。余熱で固まるので、少し早めに止める。"]},
{n:"肉豆腐",k:"卵・豆腐",t:20,i:"牛こま肉:80,豆腐:0.5,長ねぎ:0.5,しょうゆ:4.5,みりん:3,砂糖:3,酒:3,顆粒だし:0.5",
 s:["豆腐はキッチンペーパーにのせて5分水切りし、4つに切る。長ねぎは1cm幅の斜め切りにする。","鍋に水150mlと顆粒だし・しょうゆ・みりん・砂糖・酒を入れ、中火で煮立てる。","牛肉を入れてほぐし、色が変わったらアクをすくう。肉を端に寄せる。","空いた所に豆腐と長ねぎを入れ、弱めの中火で10分煮る。途中で煮汁をスプーンでかける。","豆腐に色がついたら火を止め、5分おいて味をしみ込ませる。"]},
{n:"焼きうどん",k:"麺",t:15,i:"うどん:1,豚こま肉:60,キャベツ:0.125,にんじん:0.33,しょうゆ:3,顆粒だし:0.5,サラダ油:1",
 s:["キャベツは4cm角のざく切り、にんじんは薄い短冊切りにする。ゆでうどんは袋のまま電子レンジ（600W）で1分温めると、ほぐれやすい。冷凍うどんは表示どおりに解凍する。","フライパンに油を入れて中火で熱し、豚肉を炒める。色が変わったらにんじん、キャベツの順に入れて2分炒める。","うどんと水大さじ2を入れ、箸でほぐしながら1分炒める。","顆粒だしをふり入れ、しょうゆを鍋肌から回し入れる。強めの中火で30秒、香ばしく炒める。"]},
{n:"ナポリタン",k:"麺",t:20,i:"スパゲッティ:100,ウインナー:3,玉ねぎ:0.25,ピーマン:1,ケチャップ:12,バター:10,塩:0,こしょう:0",
 s:["鍋に湯1リットルを沸かして塩小さじ2（分量外）を入れ、スパゲッティを袋の時間どおりにゆでる。ナポリタンは、やわらかめがおいしい。","玉ねぎは5mm幅の薄切り、ピーマンは種を取って細切り、ウインナーは斜め薄切りにする。","フライパンにバターを入れて中火で溶かし、玉ねぎとウインナーを2分炒める。ピーマンを入れて30秒炒める。","具を端に寄せ、空いた所にケチャップを入れて1分炒める。ふつふつして色が濃くなれば、酸味が飛んでいる。","スパゲッティを入れ、強めの中火で1分炒めてからめる。塩・こしょうで味をととのえる。"]},
{n:"焼きそば",k:"麺",t:15,i:"焼きそば麺（ソース付き）:1,豚バラ薄切り肉:60,キャベツ:0.125,もやし:0.5,サラダ油:1",
 s:["キャベツは4cm角のざく切り、豚肉は4cmに切る。もやしは洗って水気を切る。麺は袋のまま電子レンジ（600W）で40秒温めると、ほぐれやすい。","フライパンに油を入れて中火で熱し、豚肉を炒める。色が変わったらキャベツを入れて1分、もやしを入れて30秒炒め、具をいったん取り出す。","同じフライパンに麺を入れ、触らずに1分焼いて焼き色をつける。水大さじ2を入れてほぐす。","具を戻して付属のソースを入れ、強めの中火で1分、全体にからめる。"]},
{n:"きのことベーコンの和風パスタ",k:"麺",t:20,i:"スパゲッティ:100,しめじ:0.5,ベーコン:2,しょうゆ:3,バター:10,おろしにんにく:0.5,オリーブ油:1",
 s:["鍋に湯1リットルを沸かして塩小さじ2（分量外）を入れ、スパゲッティを袋の時間より1分短くゆでる。ゆで汁を大さじ3取っておく。","しめじは根元を落としてほぐす。ベーコンは1cm幅に切る。","フライパンにオリーブ油とにんにくを入れて弱火にかけ、香りが立ったら中火にする。ベーコンとしめじを入れ、しめじに焼き色がつくまで2分炒める。","スパゲッティとゆで汁を入れてひと混ぜし、バターとしょうゆを入れる。火を止め、手早く混ぜてバターを溶かす。","とろりとからんだら皿に盛る。"]},
{n:"鶏もも肉のねぎ塩焼き",k:"肉",t:20,i:"鶏もも肉:150,長ねぎ:0.5,ごま油:3,鶏がらスープの素:1,塩:0,こしょう:0",
 s:["長ねぎは細かいみじん切りにし、ごま油・鶏がらスープの素・塩ひとつまみ・こしょうと混ぜる。10分おくと、ねぎの辛みが抜ける。","鶏もも肉は厚い所を開いて厚みをそろえ、両面に塩を軽くふる。","冷たいフライパンに皮を下にして入れ、中火にかける。油はひかない。皮から脂が出てくるので、ふきながら6分、きつね色でカリッとするまで焼く。","返して弱めの中火で4分焼く。厚い所を押して弾力があればよい。","まな板で1分休ませてから切り、ねぎ塩だれをたっぷりのせる。"]},
{n:"豚肉となすの味噌炒め",k:"肉",t:15,i:"豚こま肉:100,なす:1,ピーマン:1,味噌:3,みりん:3,砂糖:1,酒:3,ごま油:3",
 s:["なすはへたを取って乱切りにし、水に3分さらして水気をふく。ピーマンは種を取って乱切りにする。","味噌・みりん・砂糖・酒を混ぜ、味噌を溶かしておく。","フライパンにごま油を入れて中火で熱し、なすを皮から入れて3分炒める。油を吸って、しんなりしてくる。","豚肉とピーマンを入れ、肉の色が変わるまで2分炒める。","合わせた調味料を入れ、強めの中火で30秒、照りが出るまでからめる。"]},
{n:"ポークソテー オニオンソース",k:"肉",t:20,i:"豚ロース肉:1,玉ねぎ:0.25,キャベツ:0.125,小麦粉:1,しょうゆ:3,みりん:3,酒:3,サラダ油:1,塩:0,こしょう:0",
 s:["豚ロース肉は冷蔵庫から出して10分おく。脂と赤身の間に、包丁の先で4〜5か所切り目を入れる。こうすると焼いても反らない。","両面に塩・こしょうをふり、小麦粉を薄くまぶす。玉ねぎはすりおろすか、ごく細かいみじん切りにする。キャベツは千切りにする。","フライパンに油を入れて中火で熱し、盛りつけるときに上になる面から3分焼く。焼き色がついたら返し、弱めの中火で3分焼いて皿に取る。","同じフライパンに玉ねぎを入れて1分炒め、しょうゆ・みりん・酒を入れる。中火で2分、とろりとするまで煮つめる。","肉にソースをかけ、キャベツを添える。"]},
{n:"鶏つくねの照り焼き",k:"肉",t:20,i:"鶏ひき肉:150,長ねぎ:0.33,片栗粉:3,おろししょうが:1,塩:0,しょうゆ:3,みりん:3,砂糖:1,サラダ油:1",
 s:["長ねぎは細かいみじん切りにする。ボウルにひき肉・長ねぎ・片栗粉・しょうが・塩ひとつまみを入れ、粘りが出るまで1分こねる。","手を水でぬらし、3〜4個に分けて厚さ1.5cmの小判形にまとめる。","フライパンに油を入れて中火で熱し、つくねを並べて3分焼く。焼き色がついたら返し、ふたをして弱火で4分蒸し焼きにする。","ふたを取り、しょうゆ・みりん・砂糖を入れて中火にする。つくねを返しながら1分、照りが出るまでからめる。","好みで卵の黄身をつけて食べてもおいしい。"]},
{n:"豚バラと白菜の重ね蒸し",k:"肉",t:20,i:"豚バラ薄切り肉:100,白菜:0.125,酒:6,顆粒だし:0.5,ポン酢:6",
 s:["白菜は葉を1枚ずつはがして洗う。白菜、豚肉、白菜、豚肉の順に3〜4段重ね、5cm幅に切る。","切り口を上にして、小さな鍋の外側からすき間なく詰める。きつく詰めると、煮崩れしない。","酒と顆粒だし、水50mlを回しかける。ふたをして中火にかける。","煮立ったら弱火にして12分蒸し煮にする。白菜の芯が透き通って、やわらかくなればよい。","鍋のまま食卓に出し、ポン酢をつけて食べる。"]},
{n:"鶏むね肉のピカタ",k:"肉",t:20,i:"鶏むね肉:150,卵:1,レタス:0.125,小麦粉:3,塩:0,こしょう:0,ケチャップ:3,オリーブ油:3",
 s:["鶏むね肉は繊維を断つように、1cm厚さのそぎ切りにする。両面に塩・こしょうをふり、小麦粉を薄くまぶす。","卵をよく溶く。レタスは食べやすくちぎる。","フライパンにオリーブ油を入れて弱めの中火で熱する。肉を卵にくぐらせて並べ、3分焼く。火が強いと卵が焦げるので注意する。","返して3分焼く。残った卵にもう一度くぐらせて戻し、両面を30秒ずつ焼いて衣を厚くする。","レタスと盛り、ケチャップを添える。"]},
{n:"たらときのこのバター蒸し",k:"魚",t:15,i:"たらの切り身:1,玉ねぎ:0.25,しめじ:0.5,バター:10,酒:3,塩:0,こしょう:0,ポン酢:3",
 s:["たらに塩をふって5分おき、出てきた水気をキッチンペーパーでふく。こしょうをふる。","玉ねぎは5mm幅の薄切りにする。しめじは根元を落としてほぐす。","フライパンに玉ねぎを広げ、その上にたらをのせる。まわりにしめじを置き、たらの上にバターをのせて酒をふる。","ふたをして中火にかけ、湯気が出てきたら弱めの中火にして8分蒸し焼きにする。たらの身が白くなって、ふっくらすればよい。","野菜ごと皿に盛り、フライパンの汁とポン酢をかける。"]},
{n:"鮭の南蛮漬け風",k:"魚",t:20,i:"鮭の切り身:1,玉ねぎ:0.25,にんじん:0.33,片栗粉:3,サラダ油:6,酢:6,しょうゆ:3,砂糖:3",
 s:["玉ねぎはできるだけ薄く切り、にんじんは千切りにする。深めの皿に酢・しょうゆ・砂糖と水大さじ1を混ぜ、野菜をひたしておく。","鮭は骨があれば取り、3つに切る。水気をふいて片栗粉をまぶす。","フライパンに油を入れて中火で熱し、鮭を皮から入れて3分焼く。返してもう2〜3分、カリッとするまで焼く。","熱いうちに野菜のたれに入れ、野菜を上にのせる。5分おくと味がなじむ。","冷蔵庫で冷やしてもおいしい。"]},
{n:"さばの塩焼き 大根おろし添え",k:"魚",t:15,i:"さばの切り身:1,大根:0.125,塩:0,しょうゆ:1",
 s:["さばは水気をふき、皮に浅く切り目を入れる。両面に塩をふたつまみずつふって5分おき、出てきた水気をもう一度ふく。","大根は皮をむいてすりおろし、ざるに上げて軽く水気を切る。","フライパンにクッキングシートを敷き、皮を下にして入れる。中火で5分、皮がこんがりするまで焼く。魚焼きグリルなら、中火で両面7〜8分焼く。","返して弱めの中火で4分焼く。身がふっくらして、箸ですっとほぐれればよい。","大根おろしを添え、しょうゆをかける。"]},
{n:"ぶり大根",k:"魚",t:30,i:"ぶりの切り身:1,大根:0.167,しょうゆ:4.5,みりん:3,砂糖:3,酒:6,おろししょうが:1",
 s:["大根は皮を厚めにむき、1.5cm厚さの半月切りにする。耐熱皿にのせてラップをし、電子レンジ（600W）で4分温めると早く煮える。","ぶりは半分に切る。ざるにのせて熱湯を回しかけ、水で血や汚れを洗って水気をふく。","鍋に大根と水200ml、酒・砂糖・みりん・しょうがを入れて中火にかける。煮立ったら、ふたをして10分煮る。","ぶりとしょうゆを入れ、アルミホイルで落としぶたをして、弱めの中火で10〜12分煮る。途中で煮汁をかける。","大根があめ色になったら火を止める。いったん冷ますと、さらに味がしみる。"]},
{n:"えびチリ",k:"魚",t:20,i:"むきえび:120,長ねぎ:0.33,ケチャップ:6,豆板醤:0.5,鶏がらスープの素:1,砂糖:1,片栗粉:3,おろししょうが:1,おろしにんにく:1,酒:3,ごま油:3",
 s:["冷凍のえびは水につけて解凍し、水気をしっかりふく。酒と片栗粉をもみ込む。長ねぎはみじん切りにする。","ケチャップ・鶏がらスープの素・砂糖と水大さじ3を混ぜておく。","フライパンにごま油の半分を入れて中火で熱し、えびを並べて片面1分ずつ焼く。色が変わって丸くなったら取り出す。","残りのごま油・しょうが・にんにく・豆板醤を入れ、弱火で香りを出す。長ねぎの半分を入れて30秒炒める。","合わせた調味料を入れて中火で煮立て、えびを戻す。30秒ほど、とろみがつくまでからめる。残りの長ねぎを散らす。"]},
{n:"鶏そぼろと卵の二色丼",k:"ごはん物",t:15,i:"鶏ひき肉:100,卵:1,ほうれん草:0.5,しょうゆ:3,みりん:3,砂糖:3,酒:3,サラダ油:1,ごはん:1",
 s:["小さな鍋に、ひき肉・しょうゆ・みりん・酒・砂糖小さじ2を入れる。火にかける前に、箸4本でよく混ぜる。こうするとポロポロになる。","中火にかけ、箸で混ぜ続ける。5分ほど、汁気がほとんどなくなるまで炒り煮にする。","卵に残りの砂糖と塩ひとつまみ（分量外）を入れて溶く。フライパンに油を入れて弱めの中火で熱し、卵を入れて箸4本で混ぜ続け、細かい炒り卵にする。","ほうれん草は塩を入れた湯で30秒ゆで、水にとってしぼり、3cmに切る。","丼にごはんを盛り、そぼろ、卵、ほうれん草を分けてのせる。"]},
{n:"豚丼",k:"ごはん物",t:15,i:"豚バラ薄切り肉:120,玉ねぎ:0.25,しょうゆ:3,みりん:3,砂糖:3,酒:3,おろししょうが:1,ごはん:1",
 s:["豚肉は5cmに切る。玉ねぎは5mm幅の薄切りにする。しょうゆ・みりん・砂糖・酒・しょうがを混ぜておく。","フライパンを中火で熱し、油をひかずに豚肉を広げて焼く。脂が出て、端に焼き色がつくまで2分焼く。","余分な脂をキッチンペーパーでふき、玉ねぎを入れて、しんなりするまで2分炒める。","合わせた調味料を入れ、強めの中火で1〜2分、照りが出るまで煮からめる。","丼にごはんを盛り、たれごとのせる。"]},
{n:"中華丼",k:"ごはん物",t:20,i:"豚こま肉:60,白菜:0.125,にんじん:0.33,しめじ:0.5,鶏がらスープの素:2,しょうゆ:3,オイスターソース:3,片栗粉:3,ごま油:3,ごはん:1",
 s:["白菜は芯と葉に分け、芯は3cm幅のそぎ切り、葉はざく切りにする。にんじんは薄い短冊切り、しめじはほぐす。","片栗粉は水大さじ1で溶く。","フライパンにごま油を入れて中火で熱し、豚肉を炒める。色が変わったら、にんじん、白菜の芯、しめじ、白菜の葉の順に入れて2分炒める。","水150mlと鶏がらスープの素・しょうゆ・オイスターソースを入れ、3分煮る。","いったん火を止め、水溶き片栗粉をもう一度混ぜてから回し入れる。混ぜながら中火にかけ、30秒煮立ててとろみをつける。ごはんにかける。"]},
{n:"キーマカレー",k:"ごはん物",t:20,i:"合いびき肉:100,玉ねぎ:0.5,にんじん:0.33,カレールウ:1,ケチャップ:3,おろしにんにく:1,サラダ油:1,ごはん:1",
 s:["玉ねぎとにんじんは細かいみじん切りにする。ルウは包丁で細かく刻むと、溶けやすい。","フライパンに油とにんにくを入れて中火で熱し、玉ねぎとにんじんを3分、しんなりするまで炒める。","ひき肉を入れ、木べらでほぐしながら、ポロポロになるまで3分炒める。","水100mlを入れて3分煮る。火を止めてルウとケチャップを入れ、溶けるまで混ぜる。","弱火にかけて2分、混ぜながら水気を飛ばす。ぽってりしたら、ごはんにかける。目玉焼きをのせてもよい。"]},
{n:"カルボナーラ",k:"麺",t:20,i:"スパゲッティ:100,ベーコン:2,卵:1,ピザ用チーズ:30,牛乳:50,オリーブ油:1,塩:0,こしょう:0",
 s:["鍋に湯1リットルを沸かして塩小さじ2（分量外）を入れ、スパゲッティを袋の時間どおりにゆでる。","ベーコンは1cm幅に切る。大きめのボウルに卵・チーズ・牛乳・こしょうを入れて、よく混ぜておく。","フライパンにオリーブ油を入れて中火で熱し、ベーコンをカリッとするまで2分炒めて火を止める。","ゆで上がったスパゲッティの湯を切り、フライパンに入れて混ぜる。30秒おいて、少し冷ます。熱すぎると卵が固まる。","卵液を入れ、手早く混ぜる。余熱でとろりとすればできあがり。ゆるければ、ごく弱火に10秒ずつかけて混ぜる。","味をみて塩でととのえ、こしょうをふる。"]},
{n:"肉うどん",k:"麺",t:15,i:"うどん:1,牛こま肉:80,長ねぎ:0.33,めんつゆ（3倍）:12,砂糖:1",
 s:["長ねぎは斜め薄切りにする。","小さな鍋にめんつゆ大さじ1・砂糖・水大さじ2を入れて中火にかける。牛肉を入れ、ほぐしながら2分、汁気が少なくなるまで煮て取り出す。","同じ鍋に水300mlと残りのめんつゆを入れて煮立てる。","うどんを入れ、ほぐしながら2〜3分煮る。冷凍うどんは凍ったまま入れてよい。","丼に汁ごと盛り、牛肉と長ねぎをのせる。"]},
{n:"ツナとキャベツのにんにくパスタ",k:"麺",t:20,i:"スパゲッティ:100,ツナ缶:1,キャベツ:0.125,おろしにんにく:1,オリーブ油:6,しょうゆ:1,塩:0,こしょう:0",
 s:["キャベツは4cm角のざく切りにする。鍋に湯1リットルを沸かして塩小さじ2（分量外）を入れ、スパゲッティを袋の時間より1分短くゆでる。","ゆで上がりの1分前に、キャベツを同じ鍋に入れる。ゆで汁を大さじ3取ってから、ざるに上げる。","フライパンにオリーブ油とにんにくを入れて弱火にかける。香りが立ったら、ツナを軽く油を切って入れる。","スパゲッティ・キャベツ・ゆで汁を入れて中火にし、フライパンをゆすりながら30秒混ぜる。油とゆで汁が白っぽくなじめばよい。","しょうゆ・塩・こしょうで味をととのえる。"]},
{n:"カレーうどん",k:"麺",t:20,i:"うどん:1,豚こま肉:60,玉ねぎ:0.25,長ねぎ:0.33,カレールウ:1,めんつゆ（3倍）:6,片栗粉:3",
 s:["玉ねぎは5mm幅の薄切り、長ねぎは斜め切りにする。片栗粉は水大さじ1で溶く。","鍋に水350mlとめんつゆを入れて中火で煮立てる。豚肉と玉ねぎを入れ、アクをすくって5分煮る。","火を止めてルウを入れ、溶けるまで混ぜる。","うどんと長ねぎを入れて中火にかけ、2分煮る。","水溶き片栗粉をもう一度混ぜてから回し入れ、混ぜながら30秒煮立ててとろみをつける。汁がはねやすいので、気をつけて食べる。"]},
{n:"厚揚げと豚肉の味噌炒め",k:"卵・豆腐",t:15,i:"厚揚げ:1,豚こま肉:60,ピーマン:1,味噌:3,みりん:3,酒:3,砂糖:1,ごま油:1",
 s:["厚揚げはキッチンペーパーで押さえて油をふき、縦半分に切ってから1.5cm幅に切る。ピーマンは種を取って乱切りにする。","味噌・みりん・酒・砂糖を混ぜ、味噌を溶かしておく。","フライパンにごま油を入れて中火で熱し、豚肉を炒める。色が変わったら厚揚げを入れ、切り口に焼き色がつくまで2分焼く。","ピーマンを入れて1分炒める。","合わせた調味料を入れ、30秒ほど全体にからめる。"]},
{n:"ひき肉入りオムレツ",k:"卵・豆腐",t:15,i:"卵:2,合いびき肉:60,玉ねぎ:0.25,牛乳:15,バター:10,塩:0,こしょう:0,ケチャップ:3",
 s:["玉ねぎはみじん切りにする。フライパンを中火で熱し、ひき肉と玉ねぎを3分炒める。塩・こしょうをして取り出し、フライパンをふく。","卵に牛乳と塩ひとつまみを入れ、よく溶く。","フライパンにバターを入れて中火で溶かし、泡が細かくなったら卵を流し入れる。箸で大きく10回ほど混ぜ、半熟にする。","火を弱め、中央に具を横長にのせる。手前と奥の卵を、具にかぶせるように折る。","フライパンの端に寄せ、皿をかぶせてひっくり返す。キッチンペーパーで形をととのえ、ケチャップをかける。"]},
{n:"豆腐チャンプルー",k:"卵・豆腐",t:15,i:"豆腐:0.5,豚バラ薄切り肉:60,卵:1,もやし:0.5,ニラ:0.33,顆粒だし:0.5,しょうゆ:3,塩:0,ごま油:3",
 s:["豆腐はキッチンペーパーで包み、重しをのせて10分水切りする。木綿豆腐が向いている。豚肉とニラは4cmに切る。卵は溶く。","フライパンにごま油の半分を入れて中火で熱し、豆腐を大きめにちぎって入れる。触らずに焼き、両面に焼き色がついたら取り出す。","残りのごま油で豚肉を炒め、塩をふる。色が変わったら、もやしを入れて30秒、ニラを入れて20秒炒める。","豆腐を戻し、顆粒だしとしょうゆで味をつける。","卵を回し入れ、10秒待ってから大きく混ぜる。半熟のうちに火を止める。"]},
{n:"トマトと卵の炒め物",k:"卵・豆腐",t:10,i:"卵:2,トマト:1,長ねぎ:0.33,鶏がらスープの素:1,砂糖:1,塩:0,ごま油:3",
 s:["トマトはへたを取り、8つのくし形に切る。長ねぎは斜め薄切りにする。","卵に鶏がらスープの素と砂糖を入れて溶く。","フライパンにごま油の半分を入れて強めの中火でしっかり熱し、卵を流し入れる。大きく3回混ぜ、半熟で皿に取り出す。","残りのごま油で長ねぎを20秒炒め、トマトを入れて塩をふる。30秒ほど、トマトの角が少し崩れるまで炒める。","卵を戻し、大きくひと混ぜして火を止める。炒めすぎると水っぽくなる。"]},
{n:"油淋鶏風 焼き鶏のねぎだれ",k:"肉",t:20,i:"鶏もも肉:150,長ねぎ:0.33,レタス:0.125,片栗粉:6,しょうゆ:3,酢:3,砂糖:2,ごま油:1,おろししょうが:1,サラダ油:6",
 s:["長ねぎは細かいみじん切りにし、しょうゆ・酢・砂糖・ごま油・しょうがと混ぜてたれを作る。","鶏もも肉は厚い所を開いて厚みをそろえ、塩・こしょう少々（分量外）をふる。片栗粉を両面にしっかりまぶす。","フライパンにサラダ油を入れて中火で熱し、皮を下にして入れる。フライ返しで軽く押さえながら5分、カリッときつね色になるまで焼く。","返して弱めの中火で4分焼く。キッチンペーパーに取って油を切り、1分休ませる。","食べやすく切ってレタスの上に盛り、ねぎだれをたっぷりかける。"]},
{n:"鶏手羽元のさっぱり煮",k:"肉",t:35,i:"鶏手羽元:4,卵:1,しょうゆ:6,酢:6,砂糖:3,酒:3,おろししょうが:1",
 s:["卵は沸騰した湯に入れて8分ゆで、水にとって殻をむく。","手羽元は水気をふき、骨に沿って包丁で1本切り込みを入れる。火が通りやすく、食べやすくなる。","鍋を中火で熱し、油をひかずに手羽元を並べる。転がしながら3分、全体に焼き色をつける。","水100mlとしょうゆ・酢・砂糖・酒・しょうがを入れる。煮立ったらアクをすくい、ゆで卵を入れてふたをし、弱めの中火で15分煮る。","ふたを取って中火にし、鍋をゆすりながら5分、煮汁が半分になって照りが出るまで煮つめる。酢の酸味は煮ると飛ぶので、すっぱくならない。"]},
{n:"鶏肉とかぼちゃの甘辛炒め",k:"肉",t:20,i:"鶏もも肉:120,かぼちゃ:0.125,しょうゆ:3,みりん:3,砂糖:1,片栗粉:3,サラダ油:3",
 s:["かぼちゃは種とわたを取り、7mm厚さの薄切りにする。固くて切りにくければ、ラップをして電子レンジ（600W）で1分温める。","鶏もも肉は3cm角に切り、片栗粉をまぶす。しょうゆ・みりん・砂糖を混ぜておく。","フライパンに油を入れて中火で熱し、かぼちゃを並べて片面2分ずつ焼く。竹串が通ったら取り出す。","同じフライパンに鶏肉を皮から入れ、3分焼いて返す。ふたをして弱めの中火で3分蒸し焼きにする。","かぼちゃを戻し、合わせた調味料を入れる。崩さないように、30秒ほどやさしくからめる。"]},
{n:"鶏むね肉の甘酢あん",k:"肉",t:25,i:"鶏むね肉:150,玉ねぎ:0.25,ピーマン:1,にんじん:0.33,片栗粉:6,ケチャップ:6,酢:6,砂糖:3,しょうゆ:3,サラダ油:6",
 s:["鶏むね肉は2cm角に切り、塩・こしょう少々（分量外）をふって片栗粉をまぶす。","玉ねぎは2cm角、ピーマンは乱切りにする。にんじんは薄い半月切りにし、ラップをして電子レンジ（600W）で1分温める。","ケチャップ・酢・砂糖・しょうゆと水大さじ2を混ぜておく。","フライパンに油を入れて中火で熱し、鶏肉を並べて転がしながら4分、カリッとするまで焼く。","余分な油をふき、野菜を入れて1分半炒める。玉ねぎに少し歯ごたえが残るくらいでよい。","合わせた調味料を入れ、強めの中火で30秒、とろみが出て全体にからむまで混ぜる。"]},
{n:"クリームシチュー",k:"肉",t:35,i:"鶏もも肉:100,じゃがいも:1,にんじん:0.33,玉ねぎ:0.5,ブロッコリー:0.25,シチュールウ:1,牛乳:50,サラダ油:1",
 s:["鶏もも肉は3cm角に切る。玉ねぎは2cm幅のくし形、にんじんは乱切りにする。じゃがいもは4つに切って水にさらす。ブロッコリーは小房に分ける。","鍋に油を入れて中火で熱し、鶏肉を炒める。色が変わったら玉ねぎ・にんじん・じゃがいもを入れて1分炒める。焦がさないようにする。","水150mlを入れる。煮立ったらアクをすくい、ふたをして弱火で15分煮る。","ブロッコリーを入れて2分煮る。火を止めてルウを入れ、溶けるまで混ぜる。","牛乳を入れて弱火にかけ、混ぜながら5分煮る。とろみがついたらできあがり。牛乳を入れてからは煮立てない。"]},
{n:"鶏肉とキャベツのガーリックバターしょうゆ",k:"肉",t:15,i:"鶏もも肉:150,キャベツ:0.125,おろしにんにく:1,バター:10,しょうゆ:3,酒:3,塩:0,こしょう:0",
 s:["鶏もも肉は3cm角に切り、塩・こしょうをふる。キャベツは5cm角のざく切りにする。","フライパンを中火で熱し、油をひかずに鶏肉を皮を下にして並べる。4分焼いて、皮がこんがりしたら返す。","さらに2分焼いたら、キャベツをのせて酒をふる。ふたをして1分半蒸す。","ふたを取り、バターとにんにくを入れて混ぜる。香りが立ったら、しょうゆを鍋肌から回し入れる。","強めの中火で20秒炒め、キャベツがしゃきっとしているうちに盛る。"]},
{n:"よだれ鶏",k:"肉",t:25,i:"鶏むね肉:150,きゅうり:1,長ねぎ:0.33,しょうゆ:3,酢:3,砂糖:1,ごま油:3,豆板醤:0.5,酒:3",
 s:["鶏むね肉は冷蔵庫から出して15分おく。厚い所に包丁を入れて開き、厚みをそろえる。","鍋に水500mlと酒を入れて沸かし、鶏肉を入れる。再び沸いたら弱火にして3分ゆで、火を止めてふたをして10分おく。余熱で火を通すと、しっとりする。","長ねぎはみじん切りにし、しょうゆ・酢・砂糖・ごま油・豆板醤と混ぜる。ゆで汁を大さじ1加える。","きゅうりは細切りにして皿に敷く。","鶏肉を取り出して7mm厚さのそぎ切りにし、きゅうりにのせる。中がピンクなら、ゆで汁に戻して2分温める。たれをかける。"]},
{n:"豚肉とピーマンの細切り炒め",k:"肉",t:15,i:"豚こま肉:100,ピーマン:2,片栗粉:3,オイスターソース:3,しょうゆ:3,酒:3,砂糖:1,ごま油:3,おろししょうが:1",
 s:["豚肉は1cm幅の細切りにし、酒と片栗粉をもみ込む。ピーマンは種を取り、縦に5mm幅の細切りにする。","オイスターソース・しょうゆ・砂糖を混ぜておく。","フライパンにごま油としょうがを入れて中火で熱し、豚肉をほぐしながら炒める。","肉の色が変わったら強めの中火にし、ピーマンを入れて1分炒める。","合わせた調味料を入れ、20秒ほど手早くからめる。ピーマンの色が鮮やかなうちに火を止める。"]},
{n:"ポークチャップ",k:"肉",t:20,i:"豚こま肉:120,玉ねぎ:0.5,しめじ:0.5,ケチャップ:9,ウスターソース:3,砂糖:1,小麦粉:3,バター:10,塩:0,こしょう:0",
 s:["豚肉は塩・こしょうをふり、小麦粉をまぶす。玉ねぎは1cm幅のくし形に切り、しめじはほぐす。","ケチャップ・ウスターソース・砂糖と水大さじ2を混ぜておく。","フライパンにバターを入れて中火で溶かし、玉ねぎを2分炒める。しめじを入れて1分炒める。","豚肉を広げて入れ、色が変わるまで2分炒める。","合わせたソースを入れ、2分ほど、とろりとするまで煮からめる。"]},
{n:"豚こまとじゃがいものカレー炒め",k:"肉",t:20,i:"豚こま肉:100,じゃがいも:1,ピーマン:1,カレー粉:1,しょうゆ:3,みりん:3,サラダ油:3,塩:0",
 s:["じゃがいもは皮をむいて7mm角の棒状に切り、水に5分さらして水気をふく。ピーマンは細切りにする。","耐熱皿にじゃがいもを広げてラップをし、電子レンジ（600W）で2分温める。","フライパンに油を入れて中火で熱し、じゃがいもを焼き色がつくまで3分炒める。","豚肉を入れて塩をふり、色が変わるまで炒める。ピーマンを入れて30秒炒める。","カレー粉をふり入れて混ぜ、しょうゆとみりんを入れて30秒からめる。"]},
{n:"とんぺい焼き",k:"肉",t:15,i:"豚バラ薄切り肉:80,キャベツ:0.125,もやし:0.5,卵:2,ウスターソース:3,ケチャップ:3,マヨネーズ:3,サラダ油:3,塩:0,こしょう:0",
 s:["キャベツは千切りにする。豚肉は4cmに切る。卵は溶く。ウスターソースとケチャップを混ぜてソースを作る。","フライパンに油の半分を入れて中火で熱し、豚肉を炒める。色が変わったらキャベツともやしを入れ、塩・こしょうをして1分炒める。皿に横長に盛る。","フライパンをふき、残りの油を中火で熱する。卵を流し入れて全体に広げ、大きく混ぜて半熟の薄焼きにする。","卵を具の上にすべらせてかぶせ、キッチンペーパーで形をととのえる。","ソースとマヨネーズをかける。"]},
{n:"焼き餃子",k:"肉",t:35,i:"豚ひき肉:80,キャベツ:0.125,ニラ:0.33,餃子の皮:12,おろししょうが:1,おろしにんにく:1,しょうゆ:3,ごま油:3,酢:3,サラダ油:3,塩:0",
 s:["キャベツは細かいみじん切りにし、塩ふたつまみをふって5分おく。水気を両手でぎゅっとしぼる。ニラは5mm幅に切る。","ボウルにひき肉・しょうが・にんにく・しょうゆ小さじ1・ごま油小さじ1を入れ、粘りが出るまでこねる。キャベツとニラを入れて混ぜる。","皮の中央にたねを小さじ2ほどのせ、ふちに水をつけて半分に折る。ひだを寄せながら、しっかり閉じる。12個作る。","フライパンにサラダ油を入れて中火で熱し、餃子を並べる。1分焼いて底に薄く焼き色をつける。","水50mlを回し入れてすぐふたをし、中火で4分蒸し焼きにする。","ふたを取って水気を飛ばし、残りのごま油を回しかける。底がパリッとしたら、皿をかぶせてひっくり返す。残りのしょうゆと酢を混ぜて、たれにする。"]},
{n:"ピーマンの肉詰め",k:"肉",t:30,i:"合いびき肉:120,ピーマン:3,玉ねぎ:0.25,パン粉:6,牛乳:15,小麦粉:3,ケチャップ:6,ウスターソース:3,サラダ油:3,塩:0,こしょう:0",
 s:["玉ねぎはみじん切りにする。パン粉は牛乳にひたす。ピーマンは縦半分に切り、種を取る。へたは残すと、肉がはがれにくい。","ボウルにひき肉・塩ふたつまみ・こしょうを入れて粘りが出るまでこね、玉ねぎとパン粉を混ぜる。","ピーマンの内側に小麦粉を薄くふる。たねを少し盛り上がるくらいに、すき間なく詰める。肉の面にも小麦粉をふる。","フライパンに油を入れて中火で熱し、肉の面を下にして3分焼く。焼き色がついたら返し、水大さじ2を入れてふたをし、弱火で6分蒸し焼きにする。","皿に取り、同じフライパンにケチャップとウスターソースを入れて30秒煮立てる。肉詰めにかける。"]},
{n:"ミートボールのトマト煮",k:"肉",t:30,i:"合いびき肉:120,玉ねぎ:0.5,トマト缶:0.5,パン粉:6,牛乳:15,コンソメ:1,ケチャップ:3,砂糖:1,オリーブ油:3,塩:0,こしょう:0",
 s:["玉ねぎは半分をみじん切り、残りを薄切りにする。パン粉は牛乳にひたす。","ボウルにひき肉・塩ふたつまみ・こしょうを入れて粘りが出るまでこねる。みじん切りの玉ねぎとパン粉を混ぜ、8個に丸める。","鍋にオリーブ油を入れて中火で熱し、ミートボールを転がしながら3分、表面に焼き色をつける。中まで火が通らなくてよい。","薄切りの玉ねぎを入れて1分炒め、トマト缶・水50ml・コンソメ・ケチャップ・砂糖を入れる。","煮立ったらふたをして、弱めの中火で10分煮る。途中で一度、やさしく混ぜる。","ふたを取って2分煮つめ、塩・こしょうで味をととのえる。"]},
{n:"プルコギ風 牛肉の甘辛炒め",k:"肉",t:20,i:"牛こま肉:120,玉ねぎ:0.25,にんじん:0.33,ニラ:0.33,しょうゆ:4.5,砂糖:3,酒:3,ごま油:3,おろしにんにく:1,おろししょうが:1",

{n:"すき焼き風煮",k:"肉",t:20,i:"牛こま肉:100,白菜:0.125,長ねぎ:0.5,豆腐:0.5,卵:1,しょうゆ:6,砂糖:6,酒:6,みりん:3",

{n:"鮭ときのこのクリーム煮",k:"魚",t:20,i:"鮭の切り身:1,ほうれん草:0.5,玉ねぎ:0.25,しめじ:0.5,牛乳:150,小麦粉:3,バター:10,コンソメ:1,塩:0,こしょう:0",
 s:["鮭は骨があれば取り、3つに切る。塩・こしょうをふり、小麦粉をまぶす。","玉ねぎは薄切り、しめじはほぐす。ほうれん草は4cmに切る。","フライパンにバターを入れて中火で溶かし、鮭を片面2分ずつ焼いて取り出す。","同じフライパンで玉ねぎとしめじを2分炒める。牛乳とコンソメを入れ、弱めの中火で温める。","鮭を戻し、ほうれん草を入れて3分煮る。鮭にまぶした粉で、自然にとろみがつく。強く煮立てると牛乳が分かれるので、ふつふつする程度にする。","塩・こしょうで味をととのえる。"]},
{n:"さばの竜田焼き",k:"魚",t:20,i:"さばの切り身:1,キャベツ:0.125,しょうゆ:3,酒:3,おろししょうが:1,片栗粉:6,サラダ油:6",

{n:"さば缶と白菜の味噌煮",k:"魚",t:15,i:"さば缶:1,白菜:0.125,長ねぎ:0.33,味噌:3,みりん:3,おろししょうが:1,顆粒だし:0.5",

{n:"ぶりのガーリックステーキ",k:"魚",t:15,i:"ぶりの切り身:1,小松菜:0.5,おろしにんにく:1,しょうゆ:3,みりん:3,バター:10,小麦粉:3,オリーブ油:1,塩:0,こしょう:0",

{n:"かじきのトマトソース煮",k:"魚",t:20,i:"かじきの切り身:1,玉ねぎ:0.25,トマト缶:0.5,おろしにんにく:1,コンソメ:1,オリーブ油:3,小麦粉:3,塩:0,こしょう:0",

{n:"たらの甘酢あんかけ",k:"魚",t:20,i:"たらの切り身:1,玉ねぎ:0.25,にんじん:0.33,ピーマン:1,片栗粉:6,酢:6,しょうゆ:3,砂糖:3,ケチャップ:3,サラダ油:6",

{n:"えびとブロッコリーの塩炒め",k:"魚",t:15,i:"むきえび:100,ブロッコリー:0.5,おろしにんにく:1,鶏がらスープの素:1,酒:3,片栗粉:3,塩:0,ごま油:3",

{n:"えびマヨ",k:"魚",t:20,i:"むきえび:120,レタス:0.125,片栗粉:6,マヨネーズ:6,ケチャップ:1,砂糖:1,酒:3,サラダ油:6",

{n:"ツナじゃが",k:"魚",t:25,i:"ツナ缶:1,じゃがいも:1,玉ねぎ:0.5,しょうゆ:3,みりん:3,砂糖:1,顆粒だし:0.5",

{n:"ハヤシライス",k:"ごはん物",t:25,i:"牛こま肉:80,玉ねぎ:0.5,しめじ:0.5,ハヤシルウ:1,バター:10,ごはん:1",

{n:"天津飯",k:"ごはん物",t:15,i:"卵:2,長ねぎ:0.33,ごはん:1,鶏がらスープの素:1,しょうゆ:3,酢:3,砂糖:3,片栗粉:3,ごま油:3",
 s:["長ねぎは小口切りにする。卵に長ねぎの半分と塩ひとつまみ（分量外）を入れて溶く。","小さな鍋に水100ml・鶏がらスープの素・しょうゆ・酢・砂糖・片栗粉を入れ、よく混ぜてから中火にかける。混ぜ続けて、とろみがついて透き通ったら火を止める。","深めの皿に、ごはんを丸く盛る。","フライパンにごま油を入れて強めの中火でしっかり熱し、卵を流し入れる。大きく5回混ぜ、半熟のうちに丸く形をととのえる。","卵をごはんにすべらせてかぶせ、あんをかける。残りの長ねぎを散らす。"]},
{n:"ガパオ風ライス",k:"ごはん物",t:15,i:"鶏ひき肉:100,ピーマン:1,玉ねぎ:0.25,卵:1,オイスターソース:3,しょうゆ:1,砂糖:1,おろしにんにく:1,サラダ油:3,ごはん:1",

{n:"ビビンバ",k:"ごはん物",t:25,i:"牛こま肉:80,ほうれん草:0.5,もやし:0.5,にんじん:0.33,卵:1,しょうゆ:3,砂糖:1,ごま油:3,鶏がらスープの素:1,おろしにんにく:1,豆板醤:0.5,ごはん:1",

{n:"タコライス",k:"ごはん物",t:15,i:"合いびき肉:100,レタス:0.125,トマト:0.5,ピザ用チーズ:20,ケチャップ:6,ウスターソース:3,カレー粉:0.5,おろしにんにく:1,サラダ油:1,ごはん:1",

{n:"キムチチャーハン",k:"ごはん物",t:10,i:"豚バラ薄切り肉:60,キムチ:80,卵:1,長ねぎ:0.33,しょうゆ:1,ごま油:3,ごはん:1",
 s:["豚肉は2cm幅に切る。キムチはざく切りにし、汁は取っておく。長ねぎはみじん切りにする。ごはんは温かいものを使う。","フライパンにごま油の半分を入れて中火で熱し、豚肉をカリッとするまで炒める。キムチを入れて1分炒める。","具を端に寄せ、空いた所に残りのごま油を入れる。卵を割り入れて軽く混ぜ、すぐにごはんをのせる。","強めの中火で、ごはんをほぐしながら2分炒める。キムチの汁を入れて混ぜる。","長ねぎを入れ、しょうゆを鍋肌から回し入れてひと混ぜする。"]},
{n:"麻婆なす丼",k:"ごはん物",t:20,i:"豚ひき肉:80,なす:1,長ねぎ:0.33,味噌:1.5,しょうゆ:3,砂糖:1,豆板醤:0.5,鶏がらスープの素:1,片栗粉:3,おろししょうが:1,おろしにんにく:1,ごま油:3,ごはん:1",

{n:"フライパンで作るミートドリア",k:"ごはん物",t:25,i:"合いびき肉:80,玉ねぎ:0.25,ケチャップ:9,ウスターソース:3,牛乳:100,小麦粉:3,バター:10,ピザ用チーズ:30,ごはん:1,塩:0,こしょう:0",

{n:"ミートソーススパゲッティ",k:"麺",t:30,i:"スパゲッティ:100,合いびき肉:80,玉ねぎ:0.25,トマト缶:0.5,ケチャップ:3,コンソメ:1,おろしにんにく:1,オリーブ油:3,砂糖:1,塩:0,こしょう:0",

/* ---------- 保存 ---------- */
const KEY="kondate-v1";
let S = load();
function fresh(){ return {v:1,plan:null,prev:[],checks:{},pantry:{},lastBackup:0,firstUse:Date.now()}; }
function clean(d){
  const s=fresh();
  if(!d||typeof d!=="object") return s;
  if(d.plan&&typeof d.plan==="object"&&/^\d{4}-\d{2}-\d{2}$/.test(d.plan.start)&&Array.isArray(d.plan.days)
     &&d.plan.days.length===7&&d.plan.days.every(n=>typeof n==="string"&&Object.hasOwn(BY,n))) s.plan={start:d.plan.start,days:d.plan.days.slice()};
  if(Array.isArray(d.prev)) s.prev=d.prev.filter(n=>typeof n==="string"&&Object.hasOwn(BY,n));
  if(d.checks&&typeof d.checks==="object") for(const k in d.checks) if(Object.hasOwn(M,k)&&d.checks[k]===true) s.checks[k]=true;
  if(d.pantry&&typeof d.pantry==="object") for(const k in d.pantry) if(Object.hasOwn(M,k)&&typeof d.pantry[k]==="boolean") s.pantry[k]=d.pantry[k];
  if(Number.isFinite(d.lastBackup)) s.lastBackup=d.lastBackup;
  if(Number.isFinite(d.firstUse)&&d.firstUse>0) s.firstUse=d.firstUse;
  return s;
}
function load(){ try{ const t=localStorage.getItem(KEY); return clean(t?JSON.parse(t):null); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{}); }catch(e){}

/* ---------- 小さな道具 ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ymd(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dayOf(start,i){ const p=start.split("-").map(Number); return new Date(p[0],p[1]-1,p[2]+i); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function frac(v){
  let n=Math.floor(v+0.02), f=v-n; if(f<0.03) return String(n);
  for(const d of [2,3,4,6,8]){ const k=Math.round(f*d); if(k>0&&k<d&&Math.abs(f-k/d)<0.025) return (n?n+"と":"")+k+"/"+d; }
  return String(Math.round(v*10)/10);
}
function qty(name,q){
  const u=M[name][0];
  if(u==="tsp"){
    if(q<=0) return "少々";
    if(q<3) return "小さじ"+frac(q);
    const half=Math.round(q/1.5)*1.5;
    if(Math.abs(half-q)<0.05) return "大さじ"+frac(q/3);
    const tb=Math.floor(q/3); return "大さじ"+tb+"＋小さじ"+frac(q-tb*3);
  }
  if(u==="g"||u==="ml") return Math.round(q)+u;
  return frac(q)+u;
}
const inPantry=n=>(n in S.pantry)?S.pantry[n]:!!M[n][2];

/* ---------- 献立を決める ---------- */
function makePlan(){
  const avoid=new Set(S.plan?S.plan.days:S.prev);
  const pick=[];
  for(const k in QUOTA){
    let pool=shuffle(R.filter(r=>r.k===k&&!avoid.has(r.n)));
    if(pool.length<QUOTA[k]) pool=pool.concat(shuffle(R.filter(r=>r.k===k&&avoid.has(r.n))));
    pick.push(...pool.slice(0,QUOTA[k]));
  }
  let order=shuffle(pick);
  for(let t=0;t<60;t++){ if(order.every((r,i)=>i===0||r.k!==order[i-1].k)) break; order=shuffle(pick); }
  if(S.plan) S.prev=S.plan.days.slice();
  S.plan={start:ymd(new Date()),days:order.map(r=>r.n)};
  S.checks={};
  save();
}
function swapDay(i){
  const used=new Set(S.plan.days), cur=BY[S.plan.days[i]];
  let pool=R.filter(r=>!used.has(r.n)&&r.k===cur.k);
  if(!pool.length) pool=R.filter(r=>!used.has(r.n));
  if(!pool.length) return;
  S.plan.days[i]=pool[Math.floor(Math.random()*pool.length)].n;
  const need=shopList().map(x=>x.name);
  for(const k in S.checks) if(!need.includes(k)) delete S.checks[k];
  save();
}
function shopList(){
  if(!S.plan) return [];
  const m=new Map();
  S.plan.days.forEach(n=>BY[n].ing.forEach(([name,q])=>{
    if(inPantry(name)) return;
    if(!m.has(name)) m.set(name,{name,q:0,dishes:[]});
    const o=m.get(name); o.q+=q; if(!o.dishes.includes(n)) o.dishes.push(n);
  }));
  return [...m.values()];
}

    xs.forEach(x=>{
      const on=!!S.checks[x.name];
      h+='<div class="row tap'+(on?" done":"")+'" data-act="check" data-n="'+esc(x.name)+'"><div class="box">✓</div>'
        +'<div class="nm"><span>'+esc(x.name)+'</span><small>'+esc(x.dishes.join("、"))+'</small></div>'
        +'<div class="q">'+esc(qty(x.name,x.q))+'</div>'
        +'<button class="txt sm" data-act="have" data-n="'+esc(x.name)+'">家にある</button></div>';
    });
    h+="</div>";
  });
  const hid=new Set(); S.plan.days.forEach(n=>BY[n].ing.forEach(a=>{ if(inPantry(a[0])) hid.add(a[0]); }));
  if(hid.size) h+='<p class="ft" style="margin-top:16px">家にある物として '+hid.size+' 品を外しています（'+esc([...hid].slice(0,6).join("、"))+(hid.size>6?" など":"")+'）。変えるときは「設定」から。</p>';
  main.innerHTML=h;
}
function renderSet(){
  $("ttl").textContent="設定"; $("sub").textContent="";
  let h='<p class="hd">バックアップ</p><div class="group"><button class="row tap tint" data-act="backup">バックアップを保存</button>'
    +'<button class="row tap tint" data-act="restore">バックアップから戻す</button></div>'
    +'<p class="ft">献立やチェックは、このiPhoneの中だけに保存されます。ホーム画面のアイコンを消すと一緒に消えます。'
    +(S.lastBackup?"最後の保存："+new Date(S.lastBackup).toLocaleDateString("ja-JP"):"")+'</p>'
    +'<p class="hd" style="margin-top:30px">家にある物</p><p class="ft" style="margin:0 16px 4px">オンにした物は、買い物リストに出しません。</p>';
  CATS.forEach(c=>{
    h+='<p class="hd">'+esc(c)+'</p><div class="group">';
    Object.keys(M).filter(n=>M[n][1]===c).forEach(n=>{
      h+='<button class="row tap" role="switch" aria-checked="'+inPantry(n)+'" data-act="pantry" data-n="'+esc(n)+'"><span class="nm">'+esc(n)+'</span><span class="sw"></span></button>';
    });
    h+="</div>";
  });
  main.innerHTML=h;
}

/* ---------- 作り方のシート ---------- */
function openSheet(i){
  const r=BY[S.plan.days[i]];
  let h='<h3>'+esc(r.n)+'</h3><p class="lead">1人分・約'+r.t+'分</p><p class="hd">材料</p><div class="group">';
  r.ing.forEach(([n,q])=>{ h+='<div class="row"><span class="nm">'+esc(n)+'</span><span class="q">'+esc(qty(n,q))+'</span></div>'; });
  h+='</div><p class="hd">作り方</p><div class="group">'+r.s.map((x,k)=>'<div class="row step"><i>'+(k+1)+'</i><span class="nm">'+esc(x)+'</span></div>').join("")+"</div>";
  $("sheetBody").innerHTML=h; $("sheetBody").scrollTop=0; $("sheetWrap").hidden=false;
}
function closeSheet(){ $("sheetWrap").hidden=true; }
$("sheetClose").onclick=closeSheet;
$("sheetWrap").onclick=e=>{ if(e.target===$("sheetWrap")) closeSheet(); };

/* ---------- お知らせ（元に戻す付き） ---------- */
let toastT=0, undoFn=null;
function toast(msg,undo){
  $("toastMsg").textContent=msg; undoFn=undo||null; $("toastUndo").hidden=!undo; $("toast").hidden=false;
  clearTimeout(toastT); toastT=setTimeout(()=>{ $("toast").hidden=true; },5000);
}
$("toastUndo").onclick=()=>{ if(undoFn) undoFn(); undoFn=null; $("toast").hidden=true; };

/* ---------- 操作 ---------- */
main.onclick=e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  const act=el.dataset.act, n=el.dataset.n, i=Number(el.dataset.i);
  if(act==="make"){
    if(S.plan&&Object.keys(S.checks).length&&!confirm("献立を作り直すと、買い物リストのチェックも消えます。作り直しますか？")) return;
    makePlan(); main.scrollTop=0; render();
  }else if(act==="swap"){ swapDay(i); render(); }
  else if(act==="open"){ openSheet(i); }
  else if(act==="check"){ if(S.checks[n]) delete S.checks[n]; else S.checks[n]=true; save(); render(); }
  else if(act==="have"){
    const had=(n in S.pantry), old=S.pantry[n], chk=!!S.checks[n];
    S.pantry[n]=true; delete S.checks[n]; save(); render();
    toast("「"+n+"」を家にある物にしました", ()=>{ if(had) S.pantry[n]=old; else delete S.pantry[n]; if(chk) S.checks[n]=true; save(); render(); });
  }
  else if(act==="pantry"){ S.pantry[n]=!inPantry(n); if(S.pantry[n]) delete S.checks[n]; save(); el.setAttribute("aria-checked",S.pantry[n]); }
  else if(act==="backup"){ backup(); }
  else if(act==="restore"){ $("file").value=""; $("file").click(); }
};
document.querySelector(".tabs").onclick=e=>{ const b=e.target.closest("button"); if(!b) return; tab=b.dataset.tab; main.scrollTop=0; render(); };

async function backup(){
  const name="kondate-backup-"+ymd(new Date())+".json";
  const text=JSON.stringify(S);
  const done=()=>{ S.lastBackup=Date.now(); save(); if(tab==="set") render(); };
  try{
    const f=new File([text],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f]}); done(); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); done();
}
$("file").onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!d||typeof d!=="object"||d.v!==1) throw 0;
    if(!confirm("今のデータを、バックアップの内容に置き換えます。よろしいですか？")) return;
    S=clean(d); save(); tab="plan"; render(); toast("バックアップから戻しました");
  }catch(err){ alert("このファイルは読み込めませんでした。このアプリで保存したバックアップを選んでください。"); }
};
render();
</script>

<style>html,body{overscroll-behavior:none}</style>
<script>
(function () {
  function canScroll(el) {
    for (; el && el !== document.body && el !== document.documentElement; el = el.parentElement) {
      var s = getComputedStyle(el);
      if (/(auto|scroll)/.test(s.overflowY) && el.scrollHeight > el.clientHeight + 1) return true;
      if (/(auto|scroll)/.test(s.overflowX) && el.scrollWidth > el.clientWidth + 1) return true;
    }
    return false;
  }
  document.addEventListener('touchmove', function (e) {
    if (e.touches.length > 1) return;
    var t = e.target;
    if (t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
    if (!canScroll(t)) e.preventDefault();
  }, { passive: false });
})();
</script>

<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
